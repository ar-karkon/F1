name: FastF1 Historical Replay Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "src/apex_f1/replay.py"
      - "src/apex_f1/historical_import.py"
      - "src/apex_f1/api.py"
      - "src/apex_f1/cli.py"
      - "tests/test_replay.py"
      - ".github/workflows/historical-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bahrain-2024:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install historical data adapter
        run: python -m pip install -e ".[data,dev]"
      - name: Fetch genuine FastF1 timing and build local replay
        run: apex-f1 import-race --year 2024 --round 1
      - name: Verify snapshot and create derived-only evidence report
        run: apex-f1 replay-report --year 2024 --round 1 > historical-verification.json
      - name: Offline chronology regression tests
        run: pytest -q tests/test_replay.py
      - name: Publish small derived report (not raw timing data)
        uses: actions/upload-artifact@v4
        with:
          name: bahrain-2024-replay-verification
          path: historical-verification.json
          retention-days: 14
