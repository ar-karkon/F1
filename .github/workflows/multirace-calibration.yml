name: Multi-Race Chronological Calibration Benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/apex_f1/calibration.py"
      - "src/apex_f1/opponent.py"
      - "src/apex_f1/openf1_import.py"
      - "src/apex_f1/cli.py"
      - "tests/test_calibration.py"
      - ".github/workflows/multirace-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multirace-2024-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install research environment (no LLM secrets)
        run: python -m pip install -e ".[dev]"
      - name: Fetch historical OpenF1 races, keep raw data local to job
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5 6 7 8 9; do
            echo "Importing OpenF1 2024 GP round $round (raw data not published)"
            apex-f1 import-race --year 2024 --round "$round" --provider openf1 \
              > /dev/null
            # Respect the public endpoint's shared request budget.
            sleep 5
          done
      - name: Fit baseline ONLY on rounds 1-3
        run: |
          apex-f1 fit-pit-model --train 2024:1 2024:2 2024:3 --horizon 3 \
            > /tmp/base-fit.json
      - name: Calibrate ONLY on rounds 4-5
        run: |
          apex-f1 fit-pit-calibrator --calibrate 2024:4 2024:5 \
            > /tmp/calibration-fit.json
      - name: Evaluate frozen models ONLY on rounds 6-9
        run: |
          apex-f1 evaluate-pit-multi --test 2024:6 2024:7 2024:8 2024:9 \
            --output multirace-2024-benchmark.json
      - name: Assert report has four held-out races and nonzero real events
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("multirace-2024-benchmark.json").read_text())
          assert r["test_races"] == ["2024:6:R","2024:7:R","2024:8:R","2024:9:R"]
          assert r["train_races"] == ["2024:1:R","2024:2:R","2024:3:R"]
          assert r["calibration_races"] == ["2024:4:R","2024:5:R"]
          assert r["pooled"]["decision_windows"] > 500
          assert r["pooled"]["positive_windows"] > 0
          print("Historical 2024 out-of-sample validation:", {
              "test_races": r["test_races"],
              "windows": r["pooled"]["decision_windows"],
              "positives": r["pooled"]["positive_windows"],
              "brier": r["pooled"]["brier"],
              "ece": r["pooled"]["expected_calibration_error_10_bins"],
          })
          PY
      - name: Offline calibration regression tests
        run: pytest -q tests/test_calibration.py
      - name: Upload aggregate report only, never source lap data
        uses: actions/upload-artifact@v4
        with:
          name: real-2024-multirace-calibration
          path: multirace-2024-benchmark.json
          retention-days: 21
