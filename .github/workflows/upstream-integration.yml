name: Upstream Integration

on:
  push:
    branches: [main]
    paths:
      - "src/apex_f1/integrations/**"
      - "tests/upstream/**"
      - "third_party/**"
      - ".gitmodules"
      - "pyproject.toml"
      - ".github/workflows/upstream-integration.yml"
      - "src/apex_f1/api.py"
  pull_request:
    paths:
      - "src/apex_f1/integrations/**"
      - "tests/upstream/**"
      - "third_party/**"
      - ".gitmodules"
      - "pyproject.toml"
      - ".github/workflows/upstream-integration.yml"
      - "src/apex_f1/api.py"

permissions:
  contents: read

jobs:
  upstream-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Clone pinned TUM and StratLab sources
        run: git submodule update --init --depth 1 third_party/race-simulation third_party/F1-StratLab
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Apex + lightweight upstream runtime requirements
        run: python -m pip install -e ".[dev,tum]"
      - name: Lint
        run: ruff check src tests
      - name: Execute real TUM model and verify StratLab source contract
        run: pytest -q tests/upstream
      - name: Save TUM output as workflow artifact
        run: apex-f1 tum-compare > tum-reference-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: tum-2017-reference-comparison
          path: tum-reference-results.json
          retention-days: 14
