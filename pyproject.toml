[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-f1-intelligence"
version = "0.1.0"
description = "Explainable motorsport race strategy and opponent intelligence research platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Apex Intelligence contributors" }]
dependencies = [
  "fastapi>=0.110,<1.0",
  "pydantic>=2.6,<3",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
data = ["fastf1>=3.5,<4"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
apex-f1 = "apex_f1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apex_f1 = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
